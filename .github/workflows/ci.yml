name: Patch Audit checks
on:
  push:
    branches: [main, 'milestone/**', 'feature/agent-evaluator-m01', 'feature/agent-evaluator-m02', 'feature/generalized-patch-audit-g02', 'feature/generalized-patch-audit-g03', 'feature/generalized-patch-audit-g03-compatibility', 'feature/generalized-patch-audit-g04']
  pull_request:
    branches: [main, 'milestone/**', 'feature/agent-evaluator-m01', 'feature/agent-evaluator-m02', 'feature/generalized-patch-audit-g01', 'feature/generalized-patch-audit-g02', 'feature/generalized-patch-audit-g03', 'feature/generalized-patch-audit-g03-compatibility']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen
      - run: npm ci --prefix frontend
      - run: |
          mkdir -p artifacts/ci-results
          set -o pipefail
          ./scripts/check 2>&1 | tee artifacts/ci-results/check.log
      - name: Check recorded hosting entrypoint
        run: uv run --project backend python -c "from app import app; assert not any(r.path.startswith(('/api/patch-audits', '/api/repository-audits')) for r in app.routes)"
      - run: cmp requirements.txt docker/release-requirements.txt
      - run: uv run --project backend playwright install --with-deps chromium
      - run: docker compose up --build -d --wait api
      - run: uv run --project backend python -m workbench.evaluator.experiment_cli import
      - name: Verify checklist migration
        run: |
          docker compose exec -T db psql -U workbench -d workbench -Atc "SELECT version_num FROM alembic_version; SELECT tgname FROM pg_trigger WHERE tgrelid='repository_audit_checklist_uses'::regclass AND NOT tgisinternal;" > artifacts/ci-results/migration.txt
          grep -Fx '011' artifacts/ci-results/migration.txt
          grep -Fx 'immutable_repository_record' artifacts/ci-results/migration.txt
      - name: Full integration and browser suite
        run: |
          set -o pipefail
          ./scripts/e2e --junitxml="$PWD/artifacts/ci-results/integration.xml" -ra 2>&1 | tee artifacts/ci-results/integration.log
      - run: |
          set -o pipefail
          ./scripts/recovery-smoke 2>&1 | tee artifacts/ci-results/recovery.log
      - run: docker compose -f compose.release.yaml up --build -d --wait
      - run: uv run --project backend python scripts/check_release.py
      - name: Recorded-only browser journeys
        run: |
          set -o pipefail
          E2E_BASE_URL=http://127.0.0.1:8020 ./scripts/e2e -k recorded_explorer_first --junitxml="$PWD/artifacts/ci-results/recorded.xml" 2>&1 | tee artifacts/ci-results/recorded.log
      - name: Build and verify bounded review evidence
        if: always()
        run: python scripts/ci_review_evidence.py
      - name: Upload bounded review evidence
        id: review-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-audit-review-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/ci-review-evidence.zip
            artifacts/ci-review-evidence.zip.sha256
      - name: Record artifact receipt
        if: always() && steps.review-evidence.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.review-evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.review-evidence.outputs.artifact-digest }}
        run: |
          printf 'Review evidence: %s\nArtifact SHA-256: %s\n' "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-workflow-evidence
          path: |
            artifacts/g4/
            artifacts/repository-audit-g3c/
            artifacts/repository-audit-g3/
            artifacts/repository-audit-g2/
            artifacts/repository-audit/
            artifacts/patch-audit/
            artifacts/evaluator/
            artifacts/evaluator-m02/
            artifacts/acceptance/
            artifacts/milestone-03/
            artifacts/milestone-04/
            compose.log
      - if: always()
        run: docker compose down
      - if: always()
        run: docker compose -f compose.release.yaml down
