name: Milestone checks
on:
  push:
    branches: [main, 'milestone/**', 'feature/agent-evaluator-m01', 'feature/agent-evaluator-m02', 'feature/generalized-patch-audit-g02']
  pull_request:
    branches: [main, 'milestone/**', 'feature/agent-evaluator-m01', 'feature/agent-evaluator-m02', 'feature/generalized-patch-audit-g01']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen
      - run: npm ci --prefix frontend
      - run: ./scripts/check
      - name: Check recorded hosting entrypoint
        run: uv run --project backend python -c "from app import app; assert not any(r.path.startswith(('/api/patch-audits', '/api/repository-audits')) for r in app.routes)"
      - run: cmp requirements.txt docker/release-requirements.txt
      - run: uv run --project backend playwright install --with-deps chromium
      - run: docker compose up --build -d --wait api
      - run: uv run --project backend python -m workbench.evaluator.experiment_cli import
      - run: ./scripts/e2e
      - run: ./scripts/recovery-smoke
      - run: docker compose -f compose.release.yaml up --build -d --wait
      - run: uv run --project backend python scripts/check_release.py
      - run: E2E_BASE_URL=http://127.0.0.1:8020 ./scripts/e2e -k recorded_explorer_first
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone-evidence
          path: |
            artifacts/repository-audit-g2/
            artifacts/repository-audit/
            artifacts/patch-audit/
            artifacts/evaluator/
            artifacts/evaluator-m02/
            artifacts/acceptance/
            artifacts/milestone-03/
            artifacts/milestone-04/
            compose.log
      - if: always()
        run: docker compose down
      - if: always()
        run: docker compose -f compose.release.yaml down
