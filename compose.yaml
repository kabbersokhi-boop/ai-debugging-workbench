name: ai-debugging-workbench

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: ai-debugging-workbench-postgres:17-vector
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports: ["127.0.0.1:${WORKBENCH_DB_PORT:-54329}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [persistence]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: ai-debugging-workbench:milestone-04
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://workbench:workbench@db:5432/workbench
    networks: [persistence]
    depends_on:
      db: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  runner:
    image: ai-debugging-workbench:milestone-04
    command: [".venv/bin/uvicorn", "workbench.runner:app", "--host", "0.0.0.0", "--port", "8011"]
    environment:
      ARTIFACT_DIR: /app/artifacts
      FIXTURE_DIR: /app/fixtures/retail
    volumes: ["evidence:/app/artifacts"]
    networks: [execution]
    read_only: true
    tmpfs: ["/tmp:size=512M,mode=1777"]
    shm_size: 512mb
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ai-debugging-workbench:milestone-04
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://workbench:workbench@db:5432/workbench
      EVALUATOR_URL: http://evaluator:8014
      RUNNER_URL: http://runner:8011
      ARTIFACT_DIR: /app/artifacts
      FIXTURE_DIR: /app/fixtures/retail
      FRONTEND_DIR: /app/frontend/dist
      REPAIR_BROKER_URL: http://repair-broker:8012
      ALLOWED_ORIGIN: http://127.0.0.1:${WORKBENCH_API_PORT:-8010}
      REPAIR_PREVIEW_ORIGIN: http://127.0.0.1:${WORKBENCH_PREVIEW_PORT:-8013}
    ports: ["127.0.0.1:${WORKBENCH_API_PORT:-8010}:8010"]
    volumes: ["evidence:/app/artifacts:ro"]
    networks: [execution, persistence, repair-control]
    read_only: true
    tmpfs: ["/tmp:size=64M,mode=1777"]
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      runner: {condition: service_healthy}
      repair-broker: {condition: service_healthy}
      evaluator: {condition: service_healthy}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10

  evaluator-image:
    build:
      context: .
      dockerfile: docker/evaluator.Dockerfile
    image: ai-agent-evaluator:python312-v1
    command: ["python", "--version"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]

  repository-node-image:
    build:
      context: .
      dockerfile: docker/repository-node.Dockerfile
    image: patch-audit-node:22-v1
    command: ["node", "--version"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]

  repository-node-compat-image:
    build:
      context: .
      dockerfile: docker/repository-node-compat.Dockerfile
    image: patch-audit-node:22-compat-v1
    command: ["node", "--version"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]

  evaluator:
    image: ai-debugging-workbench:milestone-04
    command: [".venv/bin/uvicorn", "workbench.patch_audit.broker:app", "--host", "0.0.0.0", "--port", "8014", "--workers", "1"]
    environment:
      EVALUATOR_ARTIFACT_DIR: /app/evaluator-artifacts
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "evaluator-evidence:/app/evaluator-artifacts"]
    user: "0:0"
    networks: [repair-control]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      evaluator-image: {condition: service_completed_successfully}
      repository-node-image: {condition: service_completed_successfully}
      repository-node-compat-image: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  candidate-image:
    build:
      context: .
      dockerfile: docker/candidate.Dockerfile
    image: ai-debugging-candidate:milestone-03
    command: ["image-check"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  repair-broker:
    image: ai-debugging-workbench:milestone-04
    command: [".venv/bin/python", "-m", "workbench.repair.broker"]
    environment:
      REPAIR_ARTIFACT_DIR: /app/repair-artifacts
      REPAIR_CONTROL_HOST: repair-control-broker
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "repair-evidence:/app/repair-artifacts"]
    # Only this trusted, non-model service has Docker authority. Candidate containers never do.
    user: "0:0"
    networks:
      repair-control:
        aliases: [repair-control-broker]
      repair-preview: {}
    ports: ["127.0.0.1:${WORKBENCH_PREVIEW_PORT:-8013}:8013"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      candidate-image: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import os,socket,urllib.request; urllib.request.urlopen('http://'+socket.gethostbyname(os.environ['REPAIR_CONTROL_HOST'])+':8012/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  evidence:
  repair-evidence:
  evaluator-evidence:

networks:
  repair-preview:
    driver: bridge
  repair-control:
    internal: true
  persistence:
    driver: bridge
  execution:
    internal: true
